name: Prusa Watch
version: "0.10.1-ha"
slug: prusa_watch
url: https://github.com/thewizard-de/prusa-watch
description: AI print-failure watchdog for a Prusa printer + Buddy3D camera (Claude vision, Home Assistant notifications)
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d-nozzle-alert
panel_title: Prusa Watch
map:
  - share:rw
  - media:rw
options:
  printer_host: "192.168.1.X"
  printer_model: auto
  prusalink_api_key: ""
  prusalink_username: maker
  prusalink_password: ""
  camera_url: "rtsp://192.168.1.Y/live"
  camera_rotate: "0"
  anthropic_api_key: ""
  anthropic_model: claude-haiku-5-5
  ha_notify_service: ""
  check_interval_s: 60
  compare_minutes: 5
  failure_threshold: 3
  min_confidence: 0.6
  confirm_failures: true
  warning_threshold: 3
  layout_reference: true
  use_gcode_thumbnail: true
  skip_preheat: true
  alert_cooldown_min: 30
  notify_finished: true
  keep_images: 300
  auto_action: none
  auto_action_threshold: 5
  ha_sensor: true
  power_entity: ""
  energy_price: 0.0
  currency: "€"
  dataset_enabled: true
  dataset_ok_every: 10
  dataset_max: 2000
  label_button_correct: input_button.prusa_watch_correct
  label_button_false_alarm: input_button.prusa_watch_false_alarm
  label_button_missed: input_button.prusa_watch_missed_failure
  heartbeat_min: 5
  blind_alert_min: 10
  hec_url: ""
  hec_token: ""
  hec_index: prusa_watch
  hec_verify_tls: true
  log_level: info
schema:
  printer_host: str
  printer_model: list(auto|core_one_l|core_one|xl|mk4s|mk4|mk3.5s|mk3.5|mini)
  prusalink_api_key: password?
  prusalink_username: str
  prusalink_password: password?
  camera_url: str
  camera_rotate: list(0|90|180|270)
  anthropic_api_key: password
  anthropic_model: str
  ha_notify_service: str?
  check_interval_s: int(20,600)
  compare_minutes: int(1,30)
  failure_threshold: int(1,20)
  min_confidence: float(0.3,1)
  confirm_failures: bool
  warning_threshold: int(0,20)
  layout_reference: bool
  use_gcode_thumbnail: bool
  skip_preheat: bool
  alert_cooldown_min: int(1,1440)
  notify_finished: bool
  keep_images: int(20,5000)
  auto_action: list(none|pause|stop)
  auto_action_threshold: int(1,30)
  ha_sensor: bool
  power_entity: str?
  energy_price: float(0,10)
  currency: str
  dataset_enabled: bool
  dataset_ok_every: int(1,100)
  dataset_max: int(100,20000)
  label_button_correct: str?
  label_button_false_alarm: str?
  label_button_missed: str?
  heartbeat_min: int(1,60)
  blind_alert_min: int(3,120)
  hec_url: str?
  hec_token: password?
  hec_index: str?
  hec_verify_tls: bool
  log_level: list(debug|info|warning)
